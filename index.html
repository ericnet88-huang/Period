<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#34473b" />
    <meta name="description" content="MoMo週期，溫柔記錄你的身體節奏與月經週期。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/momo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/momo.svg" />
    <title>MoMo週期｜你的身體日記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-label="MoMo週期首頁"><span>❧</span><strong>MoMo週期</strong></div>
        <button class="icon-button" id="settingsButton" aria-label="開啟設定">☼</button>
      </header>

      <section class="hero section-pad" data-view="home">
        <div class="eyebrow">WEDNESDAY · 9月10日</div>
        <h1>和身體一起，<br /><em>慢慢走。</em></h1>
        <p class="hero-copy">聽見自己的節奏，讓每個月<br />都多一點安心與從容。</p>
      </section>

      <section class="cycle-card section-pad">
        <div class="cycle-card-top"><span>目前週期</span><span class="status-dot">● 追蹤中</span></div>
        <div class="cycle-main"><strong id="cycleDay">尚未記錄</strong><span id="cycleLengthLabel">／ 28 天</span></div>
        <div class="progress-track"><div id="cycleProgress" class="progress-value"></div></div>
        <div class="cycle-meta"><span>上次月經 <b id="lastPeriod">尚未記錄</b></span><span>下次預計 <b id="nextPeriod">請先補記</b></span></div>
      </section>

      <section class="insight section-pad">
        <div class="section-heading"><div><span class="kicker">TODAY'S INSIGHT</span><h2>今天的身體訊息</h2></div><span class="sparkle">✦</span></div>
        <div class="insight-card"><div class="insight-icon">☀</div><div><strong>能量正在上升</strong><p>這幾天適合安排需要專注力的事，也別忘了給自己一點活動的空間。</p></div></div>
      </section>

      <section class="quick-actions section-pad">
        <div class="section-heading"><div><span class="kicker">QUICK LOG</span><h2>今天的狀態</h2></div></div>
        <div class="mood-row" role="group" aria-label="選擇今日心情">
          <button class="mood-button" data-mood="舒展"><span>☻</span>舒展</button>
          <button class="mood-button" data-mood="普通"><span>◡</span>普通</button>
          <button class="mood-button" data-mood="疲倦"><span>◒</span>疲倦</button>
          <button class="mood-button" data-mood="不適"><span>⌁</span>不適</button>
        </div>
        <div class="action-row"><button class="primary-button" id="logButton"><span>＋</span> 記錄今天</button><button class="secondary-button" id="backfillButton">補記錄</button></div>
      </section>

      <section class="calendar-section section-pad" data-view="calendar">
        <div class="section-heading"><div><span class="kicker">YOUR RHYTHM</span><h2>週期日曆</h2></div><div class="month-controls"><button class="month-arrow" id="prevMonth" aria-label="上一個月">‹</button><button class="text-button" id="monthButton">9月 2026</button><button class="month-arrow" id="nextMonth" aria-label="下一個月">›</button></div></div>
        <div class="calendar-card">
          <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="days" id="calendarDays"></div>
          <div class="calendar-legend"><span><i class="legend-dot period-dot"></i>經期</span><span><i class="legend-dot fertile-dot"></i>易孕期</span><span><i class="legend-dot today-dot"></i>今天</span></div>
        </div>
      </section>

      <section class="reminder section-pad" data-view="reminders">
        <div class="section-heading"><div><span class="kicker">GENTLE NUDGES</span><h2>溫柔提醒</h2></div><button class="add-reminder" id="addReminder" aria-label="新增提醒">＋</button></div>
        <div class="reminder-list" id="reminderList"></div>
      </section>

      <nav class="bottom-nav" aria-label="主要導覽"><button class="nav-item active" data-target="home"><span>⌂</span><small>首頁</small></button><button class="nav-item" data-target="calendar"><span>▦</span><small>日曆</small></button><button class="nav-item" data-target="reminders"><span>♧</span><small>提醒</small></button><button class="nav-item" data-target="profile"><span>○</span><small>我的</small></button></nav>
    </main>
    <div class="modal-backdrop" id="backfillModal" hidden>
      <section class="log-sheet" role="dialog" aria-modal="true" aria-labelledby="backfillTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-heading"><div><span class="kicker">BACKFILL LOG</span><h2 id="backfillTitle">補記身體狀態</h2></div><button class="close-button" id="closeBackfill" aria-label="關閉">×</button></div>
        <form id="backfillForm">
          <label>記錄日期<input id="recordDate" type="date" required /></label>
          <label class="check-field"><input id="periodCheck" type="checkbox" /> 這天有月經</label>
          <label>流量<select id="flowSelect"><option value="無">無</option><option value="少量">少量</option><option value="中等">中等</option><option value="大量">大量</option></select></label>
          <label>平均週期長度（天）<input id="cycleLengthInput" type="number" min="21" max="45" value="28" required /></label>
          <label>備註（選填）<textarea id="recordNote" rows="3" placeholder="今天有什麼想記下來的？"></textarea></label>
          <button class="primary-button sheet-submit" type="submit">儲存這筆記錄</button>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
